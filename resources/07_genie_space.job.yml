resources:
  jobs:
    genie_space_job:
      name: "[${bundle.target}] MA Stars - 07 Genie governed surfaces"
      tasks:
        - task_key: governed_surfaces
          notebook_task:
            notebook_path: ../src/07_genie_space/00_governed_surfaces.py
            base_parameters:
              catalog: ${var.catalog}
              coord_principal: ${var.coord_principal}
              analyst_principal: ${var.analyst_principal}
              worklist_contract: "H1234"
        - task_key: metric_view
          depends_on:
            - task_key: governed_surfaces
          notebook_task:
            notebook_path: ../src/07_genie_space/01_metric_view.py
            base_parameters:
              catalog: ${var.catalog}
              analyst_principal: ${var.analyst_principal}
        - task_key: scratch_trap
          # No depends_on: 02 reads only gold.* and writes analytics_sandbox, nothing
          # 00_governed_surfaces produces, so it runs in parallel with governed_surfaces.
          notebook_task:
            notebook_path: ../src/07_genie_space/02_scratch_trap.py
            base_parameters:
              catalog: ${var.catalog}
              analyst_principal: ${var.analyst_principal}
      queue:
        enabled: true
